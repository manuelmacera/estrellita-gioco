<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estrellita's Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: night-sky board. Header with mascot + speech bubble, a numbered timeline of empty slots, a shuffled pool of cards below. */
:root {
  --sky: #1b2547;
  --sky-2: #26335f;
  --sky-3: #33427a;
  --star: #f2b33d;
  --star-soft: #f7d58c;
  --paper: #fbf8f1;
  --ink: #23263a;
  --muted: #aab4d8;
  --good: #5fbf74;
  --bad: #e8604c;
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--sky);
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #ffffffaa 50%, transparent 51%),
    radial-gradient(1px 1px at 33% 72%, #ffffff88 50%, transparent 51%),
    radial-gradient(2px 2px at 58% 12%, #ffffffaa 50%, transparent 51%),
    radial-gradient(1px 1px at 81% 44%, #ffffff77 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 92% 86%, #ffffff99 50%, transparent 51%),
    radial-gradient(1px 1px at 6% 91%, #ffffff77 50%, transparent 51%),
    radial-gradient(1px 1px at 47% 47%, #ffffff66 50%, transparent 51%);
  background-size: 420px 420px;
  color: var(--paper);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 48px;
  display: grid;
  gap: 22px;
}
header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 14px;
  align-items: center;
}
.mascot { width: 92px; height: 92px; transition: transform .3s; }
.mascot.jump { animation: jump .7s ease; }
@keyframes jump { 30% { transform: translateY(-18px) rotate(-8deg); } 60% { transform: translateY(0) rotate(6deg); } }
.head-text { display: grid; gap: 8px; min-width: 0; }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
h1 mark { background: var(--star); color: var(--ink); padding: 0 .25em; border-radius: 6px; }
.bubble {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 10px 14px;
  font-size: 1.05rem;
  font-weight: 800;
  margin: 0;
  max-width: 620px;
}
.bubble.good { background: #e3f6e6; }
.bubble.bad { background: #fde7e2; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
}
.seg {
  display: inline-flex;
  background: var(--sky-2);
  border-radius: 999px;
  padding: 4px;
  gap: 2px;
}
.seg button {
  font: 600 1rem var(--display);
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--star); color: var(--ink); }
.stars {
  margin-left: auto;
  font: 600 1.1rem var(--display);
  color: var(--star-soft);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}
.stars svg { width: 26px; height: 26px; }
.board {
  background: var(--sky-2);
  border-radius: 22px;
  padding: 16px;
  display: grid;
  gap: 12px;
}
.row-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 600 .95rem var(--display);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.row-label .arrow { flex: 1; height: 3px; margin: 0 12px; background: linear-gradient(90deg, var(--sky-3), var(--star)); border-radius: 2px; position: relative; }
.row-label .arrow::after { content: ""; position: absolute; right: -2px; top: -6px; border: 7.5px solid transparent; border-left: 11px solid var(--star); }
.slots, .pool {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
}
.slot {
  position: relative;
  border: 3px dashed var(--sky-3);
  border-radius: 16px;
  min-height: 150px;
  display: grid;
  padding: 0;
}
.slot .ord {
  position: absolute;
  top: -12px; left: -8px;
  z-index: 2;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--sky);
  border: 3px solid var(--sky-3);
  color: var(--muted);
  display: grid; place-items: center;
  font: 700 1rem var(--display);
}
.slot.filled { border-style: solid; border-color: transparent; }
.slot.filled .ord { border-color: var(--star); color: var(--star); }
.card {
  width: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  background: var(--paper);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 16px;
  padding: 6px;
  cursor: pointer;
  font: inherit;
  text-align: center;
  box-shadow: 0 4px 0 #0e1430;
  animation: pop .25s ease;
  position: relative;
}
.card:focus-visible, .seg button:focus-visible, .btn:focus-visible { outline: 3px solid var(--star); outline-offset: 3px; }
.card img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; display: block; }
.card .label { font: 600 clamp(.85rem, 1.8vw, 1.05rem) var(--display); padding: 6px 2px 2px; line-height: 1.15; }
.card .badge {
  position: absolute; top: -10px; right: -10px;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--star); border: 3px solid var(--ink);
  display: grid; place-items: center;
  font: 700 1.1rem var(--display); color: var(--ink);
}
.card.ok { border-color: var(--good); box-shadow: 0 4px 0 #2f7a40; }
.card.no { border-color: var(--bad); box-shadow: 0 4px 0 #8f2c1f; animation: shake .45s ease; }
@keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.pool-wrap { display: grid; gap: 10px; }
.pool-title { font: 600 1rem var(--display); color: var(--muted); margin: 0; }
.pool { --cols: 4; min-height: 40px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  font: 700 1.25rem var(--display);
  border: 3px solid var(--ink);
  border-radius: 999px;
  padding: 12px 26px;
  cursor: pointer;
  background: var(--star);
  color: var(--ink);
  box-shadow: 0 4px 0 #0e1430;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.secondary { background: var(--sky-3); color: var(--paper); }
.story { background: var(--paper); color: var(--ink); border-radius: 20px; padding: 18px 20px; }
.story h2 { font: 700 1.4rem var(--display); margin: 0 0 4px; }
.story .note { margin: 0 0 12px; color: #5b6078; font-size: .95rem; }
.story ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.story li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 1.1rem; font-weight: 600; }
.story li .num { width: 36px; height: 36px; border-radius: 50%; background: var(--star); border: 3px solid var(--ink); display: grid; place-items: center; font: 700 1.05rem var(--display); }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; width: 100%; height: 100%; }
@media (max-width: 640px) {
  .slots, .pool { --cols: 2 !important; }
  .mascot { width: 70px; height: 70px; }
  .stars { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .card.no, .mascot.jump { animation: none; }
}
</style>

</head>

    storyTitle: 'Quién llegó primero, en orden',
    labels: ['Bacterias', 'Peces', 'Anfibios', 'Pequeños reptiles', 'Dinosaurios', 'Mamíferos', 'Seres humanos'],
    sentences: [
      'Bacterias: diminutas, en el mar. Durante mucho tiempo hubo solo bacterias.',
      'Peces: en el mar, con columna vertebral y aletas.',
      'Anfibios: salen del agua, pero ponen sus huevos en el agua.',
      'Pequeños reptiles: huevos con cáscara, pueden vivir lejos del agua.',
      'Dinosaurios: ¡reptiles gigantes!',
      'Mamíferos: chiquitos y peludos, les dan leche a sus crías.',
      'Seres humanos: los últimos en llegar. ¡O sea, nosotros!'
    ]
  }
};
const COUNT = { q1: 8, q2: 7 };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let S = {
  lang: store.get('lang', 'it'),
  act: store.get('act', 'q1'),
  n: store.get('n2', 4),
  stars: store.get('stars', 0),
  steps: [], pool: [], slots: [], locked: [], solved: false, msg: null
};

const $ = id => document.getElementById(id);
const tr = () => S.act === 'q2' ? Object.assign({}, T[S.lang], Q2[S.lang]) : T[S.lang];
const IMG = () => IMGS[S.act];
const nCards = () => S.n === 'all' ? COUNT[S.act] : S.n;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function newRound() {
  const N = nCards();
  const all = Array.from({ length: COUNT[S.act] }, (_, i) => i + 1);
  const ids = shuffle(all).slice(0, N).sort((a, b) => a - b);
  let pool = shuffle(ids);
  while (N > 1 && pool.every((v, i) => v === ids[i])) pool = shuffle(ids);
  S.steps = ids; S.pool = pool;
  S.slots = Array(N).fill(null); S.locked = Array(N).fill(false);
  S.solved = false; S.msg = { key: 'start' };
  render();
}

// ---------- sound (starts only after a tap)
let ac = null;
function beep(freqs, dur = 0.12, gap = 0.09, type = 'sine', vol = 0.12) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur + 0.15);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.2);
    });
  } catch (e) {}
}

function cardEl(id, where, idx) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'card';
  b.id = `card-${where}-${id}`;
  const L = tr().labels[id - 1];
  b.innerHTML = `<img src="${IMG()[id]}" alt=""><span class="label">${L}</span>`;
  if (S.solved) b.insertAdjacentHTML('beforeend', `<span class="badge" aria-label="numero ${id}">${id}</span>`);
  if (where === 'slot') {
    if (S.locked[idx]) b.classList.add('ok');
    b.addEventListener('click', () => takeBack(idx));
  } else {
    b.addEventListener('click', () => place(id));
  }
  return b;
}

function place(id) {
  if (S.solved) return;
  const i = S.slots.indexOf(null);
  if (i < 0) return;
  S.slots[i] = id; S.pool = S.pool.filter(x => x !== id);
  beep([520 + i * 60], 0.08);
  S.msg = S.slots.includes(null) ? { key: 'start' } : { key: 'full' };
  render();
}

function takeBack(i) {
  if (S.solved || S.locked[i] || S.slots[i] == null) return;
  S.pool.push(S.slots[i]); S.slots[i] = null;
  beep([330], 0.08);
  S.msg = { key: 'back' };
  render();
}

function check() {
  if (S.slots.includes(null) || S.solved) return;
  const wrong = [];
  S.slots.forEach((id, i) => { if (id === S.steps[i]) S.locked[i] = true; else wrong.push(i); });
  if (!wrong.length) {
    S.solved = true;
    S.stars += 1; store.set('stars', S.stars);
    S.msg = { key: 'ok', i: Math.floor(Math.random() * 3) };
    render();
    beep([523, 659, 784, 1047], 0.18, 0.11, 'triangle', 0.15);
    confetti();
    $('mascot').src = MASCOT.wow;
    $('mascot').classList.remove('jump'); void $('mascot').offsetWidth; $('mascot').classList.add('jump');
    return;
  }
  S.msg = { key: 'wrong', n: wrong.length };
  render();
  wrong.forEach(i => { const el = $('slots').children[i].querySelector('.card'); if (el) el.classList.add('no'); });
  beep([300, 220], 0.15, 0.14, 'triangle', 0.12);
  setTimeout(() => {
    wrong.forEach(i => { S.pool.push(S.slots[i]); S.slots[i] = null; });
    S.pool = shuffle(S.pool);
    render();
  }, 1300);
}

function render() {
  const t = tr();
  document.documentElement.lang = S.lang;
  { const src = `videos/${S.act}_${S.lang}.mp4`, v = $('vid');
    $('vsum').textContent = S.lang === 'es' ? 'Mirá el video' : 'Guarda il video';
    if (v.getAttribute('src') !== src) { v.setAttribute('src', src); v.setAttribute('poster', src.replace('.mp4', '.jpg')); } }
  $('back-menu').textContent = S.lang === 'es' ? '← Menú' : '← Menu';
  $('title').innerHTML = t.title;
  const m = S.msg || { key: 'start' };
  const msg = m.key === 'ok' ? t.ok[m.i] : m.key === 'wrong' ? t.wrong(m.n) : t[m.key];
  $('msg').textContent = msg;
  $('msg').className = 'bubble' + (m.key === 'ok' ? ' good' : m.key === 'wrong' ? ' bad' : '');
  if (!S.solved) $('mascot').src = MASCOT.happy;
  ['it', 'es'].forEach(l => $('lang-' + l).setAttribute('aria-pressed', String(S.lang === l)));
  [4, 5, 'all'].forEach(n => { const b = $('lvl-' + n); b.textContent = t.levels[n]; b.setAttribute('aria-pressed', String(S.n === n)); });
  ['q1', 'q2'].forEach(a => { const b = $('act-' + a); b.textContent = t.acts[a]; b.setAttribute('aria-pressed', String(S.act === a)); });
  $('stars-n').textContent = S.stars;
  $('row-first').textContent = t.first; $('row-last').textContent = t.last;
  $('pool-title').textContent = t.pool;
  $('pool-title').hidden = S.solved || !S.pool.length;
  $('check').textContent = t.check;
  $('check').disabled = S.solved || S.slots.includes(null);
  $('check').hidden = S.solved;
  $('reset').textContent = S.solved ? t.again : t.reset;
  $('reset').className = S.solved ? 'btn' : 'btn secondary';

  const slots = $('slots');
  const N = S.slots.length;
  const cols = N > 5 ? 4 : N;
  slots.style.setProperty('--cols', cols);
  slots.innerHTML = '';
  S.slots.forEach((id, i) => {
    const d = document.createElement('div');
    d.className = 'slot' + (id ? ' filled' : '');
    d.innerHTML = `<span class="ord">${i + 1}</span>`;
    if (id) d.appendChild(cardEl(id, 'slot', i));
    slots.appendChild(d);
  });
  const pool = $('pool');
  pool.style.setProperty('--cols', cols);
  pool.innerHTML = '';
  S.pool.forEach(id => pool.appendChild(cardEl(id, 'pool')));

  $('story').hidden = !S.solved;
  if (S.solved) {
    $('story-title').textContent = t.storyTitle;
    $('story-note').textContent = t.storyNote(COUNT[S.act]);
    $('story-list').innerHTML = S.steps.map(id => `<li><span class="num">${id}</span><span>${t.sentences[id - 1]}</span></li>`).join('');
  }
}

// ---------- confetti
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('confetti'), x = c.getContext('2d');
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#f2b33d', '#e8604c', '#5fbf74', '#6aa6ff', '#f496a0', '#b38cf0'];
  const P = Array.from({ length: 160 }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    c: cols[Math.floor(Math.random() * cols.length)], s: 6 + Math.random() * 6
  }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s, -p.s / 3, p.s * 2, p.s * .66); x.restore();
    });
    if (++f < 150) requestAnimationFrame(tick); else x.clearRect(0, 0, W, H);
  })();
}

// ---------- wiring
$('lang-it').addEventListener('click', () => { S.lang = 'it'; store.set('lang', 'it'); render(); });
$('lang-es').addEventListener('click', () => { S.lang = 'es'; store.set('lang', 'es'); render(); });
[4, 5, 'all'].forEach(n => $('lvl-' + n).addEventListener('click', () => { S.n = n; store.set('n2', n); newRound(); }));
['q1', 'q2'].forEach(a => $('act-' + a).addEventListener('click', () => { S.act = a; store.set('act', a); newRound(); }));
$('check').addEventListener('click', check);
$('reset').addEventListener('click', newRound);

window.claude?.hot?.snapshot?.(() => ({ S }));
function start(data) {
  const hsh = (location.hash || '').slice(1);
  if (hsh === 'q1' || hsh === 'q2') { S.act = hsh; store.set('act', hsh); newRound(); return; }
  if (data && data.S && data.S.act && data.S.steps && data.S.steps.length) { S = data.S; render(); }
  else newRound();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
