<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ripassiamo con Stellina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="common.css">
<style>
  .group { display: grid; gap: 12px; }
  .group h2 { margin: 0; font: 600 1rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  .tile { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 10px; text-decoration: none; box-shadow: 0 4px 0 #0e1430; }
  .tile:focus-visible { outline: 3px solid var(--star); outline-offset: 3px; }
  .tile img { width: 120px; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; }
  .tile b { font: 600 1.25rem/1.15 var(--display); display: block; }
  .tile small { font-size: .95rem; font-weight: 700; color: #5b6078; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="seg" role="group" aria-label="Lingua / Idioma">
      <button type="button" id="lang-it">Italiano</button>
      <button type="button" id="lang-es">Español</button>
    </div>
    <span class="stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#f2b33d" stroke="#23263a" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="stars-n">0</span></span>
  </div>
  <header class="hero">
    <img class="mascot" src="img/mascot.png" alt="">
    <div><h1 id="title"></h1><p class="bubble" id="msg"></p></div>
  </header>
  <div id="menu" style="display:grid;gap:22px"></div>
</div>
<script>
const MENU = [
  { g: { it: '1 · La Terra', es: '1 · La Tierra' }, items: [
    { href: 'ordina.html#q1', img: 'img/step1.jpg', t: { it: 'Metti in ordine la storia', es: 'Ordená la historia' }, d: { it: 'Dal Big Bang ai continenti', es: 'Del Big Bang a los continentes' } },
    { href: 'parole.html', img: 'img/step3.jpg', t: { it: 'Completa le frasi', es: 'Completá las frases' }, d: { it: 'Sole, pianeti, vita...', es: 'Sol, planetas, vida...' } } ] },
  { g: { it: '2 · Gli esseri viventi', es: '2 · Los seres vivos' }, items: [
    { href: 'ordina.html#q2', img: 'img/q2_3.jpg', t: { it: 'Chi è arrivato prima?', es: '¿Quién llegó primero?' }, d: { it: 'Dai batteri agli esseri umani', es: 'De las bacterias a los seres humanos' } } ] },
  { g: { it: '3 · I dinosauri', es: '3 · Los dinosaurios' }, items: [
    { href: 'ere.html', img: 'img/era3.jpg', t: { it: 'Le ere', es: 'Las eras' }, d: { it: 'Arcaica, Primaria, Secondaria...', es: 'Arcaica, Primaria, Secundaria...' } },
    { href: 'dinosauri.html', img: 'img/dino4.jpg', t: { it: 'I dinosauri', es: 'Los dinosaurios' }, d: { it: 'Attacco, difesa, cibo e il tuo preferito', es: 'Ataque, defensa, comida y tu preferido' } },
    { href: 'estinzione.html', img: 'img/ext_meteor.jpg', t: { it: 'Dove sono finiti?', es: '¿Qué les pasó?' }, d: { it: 'Le ipotesi sulla scomparsa', es: 'Las hipótesis de la desaparición' } } ] }
];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let lang = store.get('lang', 'it');
function render() {
  document.documentElement.lang = lang;
  document.getElementById('title').innerHTML = lang === 'it' ? 'Ripassiamo con <mark>Stellina</mark>!' : '¡Repasemos con <mark>Estrellita</mark>!';
  document.getElementById('msg').textContent = lang === 'it' ? 'Scegli un gioco!' : '¡Elegí un juego!';
  document.getElementById('stars-n').textContent = store.get('stars', 0);
  ['it', 'es'].forEach(l => document.getElementById('lang-' + l).setAttribute('aria-pressed', String(lang === l)));
  document.getElementById('menu').innerHTML = MENU.map(s => `<section class="group"><h2>${s.g[lang]}</h2><div class="grid">${s.items.map(i => `<a class="tile" href="${i.href}"><img src="${i.img}" alt=""><span><b>${i.t[lang]}</b><small>${i.d[lang]}</small></span></a>`).join('')}</div></section>`).join('');
}
['it', 'es'].forEach(l => document.getElementById('lang-' + l).addEventListener('click', () => { lang = l; store.set('lang', l); render(); }));
render();
</script>
</body>
</html>
